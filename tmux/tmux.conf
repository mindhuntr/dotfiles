# Vars 
set -g pane-border-style fg=magenta
set -ga terminal-overrides ",tmux-256color:Tc"
set -ga terminal-overrides ",*:wcwidth@UTF-8"
set -ga terminal-overrides ',allow-unsupported-escape-sequences' 
set -ga terminal-overrides ',*:RGB' 
set -g pane-active-border-style fg=magenta
set-option -g default-command bash
set -g allow-passthrough on
set -g mouse on

## UTF - 8
set -g default-terminal "tmux-256color"
set-window-option -q -g utf8 on
set-environment -g LANG "en_US.UTF-8"
set-environment -g LC_ALL "en_US.UTF-8"

# Prefix 
unbind C-b
set -g prefix C-w
bind C-w send-prefix

unbind r 
bind r source-file $HOME/.config/tmux/tmux.conf

## Bindings 
bind j split-window -v -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# Numbering
set-option -g renumber-windows on

## Plugins 
set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

## Cattppucin config 
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"


set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

set-hook -g session-window-changed 'run-shell "killall ueberzug"'
set-hook -g window-linked 'run-shell "killall ueberzug"'

unbind c

# Alt+number to select window 
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-c new-window 


# Vim mode 
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection 
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle 
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
