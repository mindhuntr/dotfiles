#                                                                                     
# dotfiles circa 2025 

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor = eDP-1, 1920x1080@120, 0x0, 1
monitor = HDMI-A-1,preferred,auto,1,mirror,eDP-1

# Some default env vars.
# env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,22
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = GTK_THEME,Catppuccin-purple
env = GTK_ICON_THEME,Papirus-Dark

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DESKTOP_PORTAL,gtk

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Daemons 
exec-once = waybar
exec-once = systemctl --user start hyprpaper
exec-once = systemctl --user start dark-send
exec-once = hyprctl setcursor Bibata-Modern-Classic 22 
exec-once = mako
exec-once = nm-applet --indicator 
# exec-once = unclutter --timeout 1
exec-once = $HOME/.bin/read_time.sh
exec-once = $HOME/.config/hypr/scripts/battery_notify.sh
exec-once = $HOME/.config/hypr/scripts/battery_warning.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = hyprpm reload # load plugins

# Startup applications 
exec-once = zen-browser 
exec-once = $HOME/Downloads/Telegram/Telegram
exec-once = kitty --class weechat -e weechat

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set variables
$terminal = kitty --title "Kitty"
$fileManager = thunar 
$menu = rofi
$volume = pactl set-sink-volume @DEFAULT_SINK@
$brightness = brightnessctl
$iconpath = $HOME/.config/hypr/notify_icons
$workspace = $HOME/.config/hypr/scripts/ws_switch.sh

# For all categories, see https://wiki.hypr.land/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hypr.land/Configuring/Variables/ for more

    gaps_in = 10
    gaps_out = 10
    border_size = 3
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgb(166,173,200)
    col.inactive_border = rgba(595959aa)

    layout = scrolling

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

}

cursor { 
    inactive_timeout = 1
    hide_on_key_press = true;
} 

decoration {
    # See https://wiki.hypr.land/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 7
        passes = 3
        noise = 0.08

        ignore_opacity = true
        contrast = 1.5

        xray = false
        new_optimizations = true
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # bezier = myBezier, 0.22, 1, 0.36, 1
    # bezier = overshoot, 0.05, 0.9, 0.1, 1.0.5

    animation = windowsIn, 1, 7, myBezier, popin
    animation = windowsOut, 1, 7, myBezier, popin 100%
    animation = windowsMove, 1, 7, myBezier, popin 100%

    animation = layersIn, 1, 5, myBezier, popin 
    animation = layersOut, 1, 5, myBezier, popin 100%

    animation = fade, 1, 9, myBezier

    animation = specialWorkspaceIn, 1, 10,  myBezier, fade
    animation = specialWorkspaceOut, 1, 10, myBezier, fade

    animation = border, 1, 7, myBezier
    animation = borderangle, 1, 7, myBezier
    animation = workspaces, 1, 5, myBezier, slidevert
}

dwindle {
    # See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
    force_split = 2
}


gestures {
    # See https://wiki.hypr.land/Configuring/Variables/ for more
}

misc {
    # See https://wiki.hypr.land/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    allow_workspace_cycles = true
}

plugin {
    hyprscrolling {
        column_width = 0.6
        fullscreen_on_one_column = true
        focus_fit_method = 1
    }
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more


# Window Rules 
windowrule = match:class .*, suppress_event maximize   # You'll probably like this.
windowrule = match:class .*, focus_on_activate on

# Ueberzugpp 
# windowrule = animation slide left, class:^(.*ueberzugpp.*)$

# Blurring 
windowrule = match:title ^(.*Telegram.*)$, no_blur on 
# windowrulev2 = animation popin 100%, class:^(org.telegram.*) title:^(Media viewer)$
# windowrulev2 = layer, class:^(org.telegram.*) title:^(Media viewer)$ 

windowrule = match:class ^(xdg-desktop-portal-gtk)$, no_blur on
windowrule = match:class ^(Xdg-desktop-portal-gtk)$, no_blur on

# windowrule = match:class ^(swayimg.*)$, blur, 0.5
# windowrule = opacity 0.7 0.7, match:class ^(swayimg.*)$,

# windowrule =  blur on, match:class ^(swayimg.*)$
windowrule = animation slide, match:class ^(swayimg.*)$
windowrule = opacity 0.8 0.8, match:class ^(swayimg_.*)$


windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 1000 600
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center on

# layerrule = noanim,selection

windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(zen)$, workspace 2
windowrule = match:title ^(.*Telegram.*)$, workspace 3
windowrule = match:class ^(.*org.telegram.desktop.*)$, workspace 3
windowrule = match:class ^(weechat)$, workspace 4
windowrule = match:class ^(Pinterest)$, workspace 5 
windowrule = match:class ^(WhatsApp Desktop)$, workspace 7 
windowrule = match:class ^(syncplay)$, workspace 8 
windowrule = match:title ^(feed_mpv)$, workspace 8
windowrule = match:class ^(Mailspring)$, workspace 9
windowrule = match:class ^(discord)$, workspace 10

# Stream full screen
# windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
# windowrule = noanim, class:^(xwaylandvideobridge)$
# windowrule = noinitialfocus, class:^(xwaylandvideobridge)$
# windowrule = maxsize 1 1, class:^(xwaylandvideobridge)$
# windowrule = noblur, class:^(xwaylandvideobridge)$
# windowrule = nofocus, class:^(xwaylandvideobridge)$

# See https://wiki.hypr.land/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = SUPER, Tab, workspace, previous
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, E, exec, $HOME/.config/rofi/scripts/powermenu/powermenu
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating, 
bind = $mainMod SHIFT, space, exec, hyprctl dispatch togglefloating
bind = $mainMod, C, exec, makoctl dismiss --all
bind = $mainMod, W, exec, $HOME/.config/waybar/launch.sh
bind = $mainMod SHIFT, C, exec, $HOME/.config/waybar/scripts/dnd-toggle.sh toggle 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle

# Binding for Applications 
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, zen-browser 
bind = $mainMod, D, exec, $menu -show drun
bind = $mainMod, E, exec, $menu -modi emoji -show emoji
bind = $mainMod SHIFT, F, exec, $menu -modi filebrowser -show filebrowser
bind = $mainMod, T, exec, XDG_DESKTOP_PORTAL=gtk $HOME/Downloads/Telegram/Telegram
bind = $mainMod, O, exec, /opt/WhatsApp\ Desktop/whatsapp-linux-desktop
bind = $mainMod, N, exec, $HOME/.bin/nightlight.sh
bind = $mainMod SHIFT, B, exec, $HOME/.bin/bookmarks.sh
bind = $mainMod SHIFT, X, exec, hyprlock
bind = $mainMod, X, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

# Screenshot 
bind = $mainMod, Y, exec, $HOME/.config/rofi/scripts/screenshot/screenshot --clipboard-only
bind = $mainMod SHIFt, Y, exec, $HOME/.config/rofi/scripts/screenshot/screenshot
bind = $mainMod, Z, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy

# Color picker 
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# Move focus with mainMod + arrow keys
bind = $mainMod, h, layoutmsg, focus l
bind = $mainMod, l, layoutmsg, focus r
bind = $mainMod, k, layoutmsg, focus u
bind = $mainMod, j, layoutmsg, focus d

# Move Windows (Diwndle Layout)
# bind = $mainMod SHIFT, h, movewindow, l
# bind = $mainMod SHIFT, l, movewindow, r
# bind = $mainMod SHIFT, k, movewindow, u
# bind = $mainMod SHIFT, j, movewindow, d 

# Move Windows (Scrolling Layout)
bind = $mainMod, period, layoutmsg, colresize +0.1
bind = $mainMod, comma, layoutmsg, colresize -0.1

bind = $mainMod SHIFT, period, layoutmsg, move r
bind = $mainMod SHIFT, comma, layoutmsg, swapcol l

bind = $mainMod SHIFT, l, layoutmsg, movewindowto r
bind = $mainMod SHIFT, h, layoutmsg, movewindowto l
bind = $mainMod SHIFT, k, layoutmsg, movewindowto u
bind = $mainMod SHIFT, j, layoutmsg, movewindowto d

# Resize Mode (Inspired by i3) 
bind = $mainMod, R,submap,resize
submap=resize
bind = , h, resizeactive, -20 0
bind = , l, resizeactive, 20 0
bind = , k, resizeactive, 0 -20
bind = , j, resizeactive, 0 20
bind = , Escape,submap,reset
submap=reset

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, $workspace 1
bind = $mainMod, 2, exec, $workspace 2
bind = $mainMod, 3, exec, $workspace 3
bind = $mainMod, 4, exec, $workspace 4
bind = $mainMod, 5, exec, $workspace 5
bind = $mainMod, 6, exec, $workspace 6
bind = $mainMod, 7, exec, $workspace 7
bind = $mainMod, 8, exec, $workspace 8
bind = $mainMod, 9, exec, $workspace 9
bind = $mainMod, 0, exec, $workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic
binde = $mainMod, 0xffad, togglespecialworkspace, magic
binde = $mainMod SHIFT, 0xffad, movetoworkspace, special:magic

# Move workspaces with mainMod + left and right arrow keys
bind = Ctrl $mainMod, up, workspace, e-1
bind = Ctrl $mainMod, down, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Controls 
binde = , xf86audioraisevolume, exec, $volume +3% && notify-send --hint=string:x-dunst-stack-tag:wallpaper --hint=string:synchronous:wallpaper -c system-notification -t 450 --icon=$iconpath/volume-plus.png "" --hint="int:value:$($HOME/.bin/volume.sh output %v)"

binde = , xf86audiolowervolume, exec, $volume -3% && notify-send --hint=string:x-dunst-stack-tag:wallpaper --hint=string:synchronous:wallpaper -c system-notification -t 450 --icon=$iconpath/volume-minus.png "" --hint="int:value:$($HOME/.bin/volume.sh output %v)"
 
# Mute toggles
binde = , xf86audiomute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle && exec $HOME/.bin/volmutetoggle.sh
binde = , xf86audiomicmute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle && exec $HOME/.bin/mictoggle.sh 
bind = $mainMod, M, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle && exec $HOME/.bin/mictoggle.sh


# Brightness Controls 
binde = , xf86monbrightnessup, exec, $brightness s +2% && notify-send --hint=string:x-dunst-stack-tag:wallpaper --hint=string:synchronous:wallpaper -c system-notification -t 450 --icon=$iconpath/brightness-up.png "" --hint="int:value:$($HOME/.bin/brightness_bar.sh)"

binde = , xf86monbrightnessdown, exec, $brightness s 2%- && notify-send --hint=string:x-dunst-stack-tag:wallpaper --hint=string:synchronous:wallpaper -c system-notification -t 450 --icon=$iconpath/brightness-down.png "" --hint="int:value:$($HOME/.bin/brightness_bar.sh)"

