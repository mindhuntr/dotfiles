label {
    monitor =
    text = cmd[update:1000] echo -e "$(~/.config/hypr/scripts/battery_display.sh)"
    color = rgba(255, 255, 255, 1)
    font_size = 12
    font_family = JetBrains Mono Medium Nerd Font
    position = -20, -510
    halign = right
    valign = center
}

